<!DOCTYPEDOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Treats Candy Co.</title>
    <style>
        :root {
            --primary: #ff69b4;
            --secondary: #9b59b6;
            --dark: #2c3e50;
            --light: #f9f9f9;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            text-align: center;
            padding: 50px;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: var(--secondary);
        }
    </style>
</head>
<body>

    <h1>Welcome to Candy Co.!</h1>
    <p>Click the button below to see the magic happen.</p>

    <!-- The Button -->
    <button class="btn" onclick="celebrate()">Click Me!</button>

    <!-- JavaScript code placed inside the file ensures it works instantly -->
    <script>
        function celebrate() {
            alert("🍬 Yay! The button is officially working on GitHub Pages!");
        }
    </script>

</body>
</html>
